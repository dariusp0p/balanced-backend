spring.application.name=balanced-backend
# For local development on phone: add comma-separated origins, e.g:
# app.cors.allowed-origins=http://localhost:5173,http://192.168.1.100:5173
# Or use environment variable: CORS_ALLOWED_ORIGINS

server.address=0.0.0.0
server.port=8080

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app.security.session-ttl-minutes=480

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/balanced_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:balanced_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:balanced123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validateOnMigrate=false
spring.flyway.outOfOrder=true

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://balanced_mongo:balanced123@localhost:27017/balanced_chat?authSource=admin}

app.chat.sql-migration.enabled=${APP_CHAT_SQL_MIGRATION_ENABLED:true}
