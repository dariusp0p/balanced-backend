spring.application.name=balanced-backend

server.address=0.0.0.0
server.port=${PORT:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app.security.session-ttl-minutes=${APP_SECURITY_SESSION_TTL_MINUTES:480}
app.security.failed-login.limit=${APP_SECURITY_FAILED_LOGIN_LIMIT:5}
app.security.failed-login.window-minutes=${APP_SECURITY_FAILED_LOGIN_WINDOW_MINUTES:15}
app.security.failed-recovery.limit=${APP_SECURITY_FAILED_RECOVERY_LIMIT:5}
app.security.failed-recovery.window-minutes=${APP_SECURITY_FAILED_RECOVERY_WINDOW_MINUTES:15}
app.security.rate-limit.global.limit=${APP_SECURITY_RATE_LIMIT_GLOBAL:240}
app.security.rate-limit.global.window-seconds=${APP_SECURITY_RATE_LIMIT_GLOBAL_WINDOW_SECONDS:60}
app.security.rate-limit.auth.limit=${APP_SECURITY_RATE_LIMIT_AUTH:30}
app.security.rate-limit.auth.window-seconds=${APP_SECURITY_RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/balanced_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:balanced_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:balanced123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validateOnMigrate=false
spring.flyway.outOfOrder=true

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://balanced_mongo:balanced123@localhost:27017/balanced_chat?authSource=admin}
