spring.application.name=balanced-backend
app.cors.allowed-origins=http://localhost:5173

app.security.session-ttl-minutes=480

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/balanced_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:balanced_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:balanced123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration